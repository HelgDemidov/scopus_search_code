version: 2

updates:
  # Python зависимости (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"

  # npm зависимости (frontend/package.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      # typescript-eslint не поддерживает TS>=7 (см. память
      # project-typescript-eslint-ts7-incompat, инцидент 2026-08-14 — дефолтный
      # dependabot-бамп typescript до 7.0.2 12 дней держал ESLint-джобу красной
      # незамеченной, т.к. frontend-чеки не входят в required checks). Снять
      # запрет, когда typescript-eslint официально анонсирует поддержку TS7
      # (апстрим-issue typescript-eslint/typescript-eslint#10940).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions (actions/checkout, setup-python и т.д.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
