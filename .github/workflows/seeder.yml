name: Scheduled DB Seeder

on:
  # Разморожено 2026-08-19 — был заморожен 08-18 из-за (как выяснилось, ложного
  # для этого публичного репо) опасения по лимиту Actions-минут аккаунта, см.
  # память project-catalog-search-latency и project_dependabot_batch_merge. Раз
  # в 4 часа, не раз в 2 — сознательно медленнее прежнего темпа. VACUUM_EVERY_N_RUNS=10
  # (app/routers/seeder_router.py) не менялся: 10×4ч=40ч всё ещё безопасно внутри
  # ~2-суточного окна деградации GIN pending-list (project-catalog-search-latency,
  # 08-03) — при вдвое более редких прогонах суммарный объём новых строк за то же
  # окно тоже вдвое меньше, риск не растёт.
  schedule:
    - cron: "0 */4 * * *"
  # Ручной запуск: выбор среды через input
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (production or staging)"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  seed:
    name: Run Scopus Seeder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install seeder dependencies
        # Устанавливаем только нужные пакеты — не тянем весь requirements.txt
        run: pip install httpx asyncpg colorama

      - name: Run seeder (production)
        # Запускается при schedule (всегда production) или workflow_dispatch с environment=production
        if: ${{ github.event_name == 'schedule' || github.event.inputs.environment == 'production' }}
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_SUPABASE_URL }}
          SEEDER_SECRET:      ${{ secrets.SEEDER_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # SEEDER_BASE_URL не задан — seed_db.py использует фолбэк на production URL
        working-directory: db_seeder/seeder__scripts
        run: python seed_db.py

      - name: Run seeder (staging)
        # Запускается только при ручном workflow_dispatch с environment=staging
        if: ${{ github.event.inputs.environment == 'staging' }}
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_SUPABASE_STAGING_URL }}
          SEEDER_SECRET:      ${{ secrets.SEEDER_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEEDER_BASE_URL:    ${{ secrets.RAILWAY_STAGING_BASE_URL }}
        working-directory: db_seeder/seeder__scripts
        run: python seed_db.py
