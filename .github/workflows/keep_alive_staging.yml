name: Keep Alive – Staging Supabase

# Staging Supabase ставится на паузу администраторами Supabase после ~недели
# отсутствия активности — раз в сутки достаточно. Решает ДРУГУЮ задачу, чем
# прод anti-sleep (не даёт заснуть Railway hobby-tier прод-сервису, таймаут
# ~15 минут) — тот раньше жил в keep_alive.yml, удалён 2026-09-01: GitHub
# Actions не соблюдал даже урезанный до */30 cron (реальный интервал между
# прогонами — часы, не минуты, см. docs/backend-performance/
# explore-cold-start-mitigation/spec.md §3.3) — заменён внешним uptime-
# монитором вне этого репозитория. Staging-пинг здесь не затронут: раз в
# сутки не подвержен той же проблеме так же сильно, задача другая (anti-pause
# Supabase, не anti-sleep Railway) — ничего не меняем.
on:
  schedule:
    - cron: '17 4 * * *'  # раз в сутки, 04:17 UTC — смещено от ровного часа
  workflow_dispatch:          # ручной запуск из GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health/db on staging (GET – wakes DB connection)
        run: |
          curl -f -X GET "${{ secrets.RAILWAY_STAGING_BASE_URL }}/health/db"
          echo "Staging DB health status: $?"

      - name: Ping /health on staging (GET – smoke check, no DB)
        run: |
          curl -f -X GET "${{ secrets.RAILWAY_STAGING_BASE_URL }}/health"
          echo "Staging app health status: $?"
