name: OpenAlex PDF Feed

on:
  schedule:
    - cron: "0 6 * * *" # ежедневно 06:00 UTC — временно, на период бэкфилла истории по 8 фразам
    # (см. коммит: первый ручной прогон 2026-08-03 исчерпал суточный бюджет OpenAlex
    # на 98/233 статей ОДНОЙ первой фразы — при еженедельном cron бюджет остальных
    # 6 дней недели простаивал впустую. Вернуть на "0 6 * * 1", когда бэкфилл догонит
    # историю и прогоны начнут стабильно упираться в "уже всё скачано".)
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    name: Run OpenAlex PDF Feed
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # Минимальный набор — не тянем requirements.txt целиком (по образцу seeder.yml)
        run: pip install httpx boto3 pyyaml colorama

      - name: Restore terms.yaml from secret
        # terms.yaml больше не в репозитории (личные поисковые фразы, см. .gitignore) —
        # содержимое хранится в секрете OPENALEX_TERMS_YAML и материализуется здесь,
        # до запуска run.py (который читает файл с диска, см. _load_terms()).
        env:
          OPENALEX_TERMS_YAML: ${{ secrets.OPENALEX_TERMS_YAML }}
        run: printf '%s\n' "$OPENALEX_TERMS_YAML" > openalex_pdf_feed/terms.yaml

      - name: Mask individual search phrases in logs
        # GitHub маскирует только точное совпадение ПОЛНОГО секрета целиком —
        # отдельные фразы, которые run.py построчно печатает в прогрессе
        # ("── Фраза: '<term>' ──"), это не покрывает. Регистрируем каждую
        # фразу отдельной маской до запуска run.py — чистый вывод workflow
        # command (::add-mask::), без сетевых вызовов и заметного времени.
        run: |
          python -c "
          import yaml
          for term in yaml.safe_load(open('openalex_pdf_feed/terms.yaml', encoding='utf-8')):
              print(f'::add-mask::{term}')
          "

      - name: Run openalex_pdf_feed
        # -m, не прямой путь к файлу: run.py использует пакетные импорты
        # (from openalex_pdf_feed.X import ...), нужен корень репозитория в sys.path
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m openalex_pdf_feed.run
