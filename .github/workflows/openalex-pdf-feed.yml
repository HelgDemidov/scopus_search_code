name: OpenAlex PDF Feed

on:
  # ЗАМОРОЖЕНО 2026-08-18: автозапуск по расписанию отключён (лимит Actions-минут
  # аккаунта — 2000/мес — исчерпан на 96%, см. тот же коммит, что и seeder.yml и
  # keep_alive.yml). Раскомментировать schedule + cron ниже, чтобы вернуть
  # ежедневный прогон.
  # schedule:
  #   - cron: "0 6 * * *" # ежедневно 06:00 UTC — временно, на период бэкфилла истории
    # (см. коммит 624a02b: первый ручной прогон 2026-08-03 исчерпал суточный бюджет
    # OpenAlex на 98/233 статей ОДНОЙ первой фразы из восьми — при еженедельном cron
    # бюджет остальных 6 дней недели простаивал впустую.
    # 2026-08-14: словарь разбит на кластеры (terms.yaml), run.py обрабатывает ровно
    # один кластер за прогон (ротация по дню, отдельный курсор на кластер в R2) —
    # раньше все 8 фраз шли одним списком каждый день, и бюджет стабильно упирался
    # в последнюю (medical anthropology), курсор не продвигался НИ РАЗУ за 12 дней
    # (см. память project-openalex-pdf-feed). Условие возврата на "0 6 * * 1"
    # прежнее — когда прогоны начнут стабильно упираться в "уже всё скачано" для
    # ОБОИХ кластеров, не только для более лёгкого из них.)
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    name: Run OpenAlex PDF Feed
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # Минимальный набор — не тянем requirements.txt целиком (по образцу seeder.yml)
        run: pip install httpx boto3 pyyaml colorama

      - name: Restore terms.yaml from secret
        # terms.yaml больше не в репозитории (личные поисковые фразы, см. .gitignore) —
        # содержимое хранится в секрете OPENALEX_TERMS_YAML и материализуется здесь,
        # до запуска run.py (который читает файл с диска, см. _load_terms()).
        env:
          OPENALEX_TERMS_YAML: ${{ secrets.OPENALEX_TERMS_YAML }}
        run: printf '%s\n' "$OPENALEX_TERMS_YAML" > openalex_pdf_feed/terms.yaml

      - name: Mask individual search phrases in logs
        # GitHub маскирует только точное совпадение ПОЛНОГО секрета целиком —
        # отдельные фразы, которые run.py построчно печатает в прогрессе
        # ("── Фраза: '<term>' ──"), это не покрывает. Регистрируем каждую
        # фразу отдельной маской до запуска run.py — чистый вывод workflow
        # command (::add-mask::), без сетевых вызовов и заметного времени.
        # terms.yaml — словарь {кластер: [фразы]} (2026-08-14, ротация по
        # кластерам), маскируем фразы ВСЕХ кластеров разом — сегодняшний
        # кластер выбирает run.py, а не этот шаг.
        run: |
          python -c "
          import yaml
          clusters = yaml.safe_load(open('openalex_pdf_feed/terms.yaml', encoding='utf-8'))
          for terms in clusters.values():
              for term in terms:
                  print(f'::add-mask::{term}')
          "

      - name: Run openalex_pdf_feed
        # -m, не прямой путь к файлу: run.py использует пакетные импорты
        # (from openalex_pdf_feed.X import ...), нужен корень репозитория в sys.path
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m openalex_pdf_feed.run
