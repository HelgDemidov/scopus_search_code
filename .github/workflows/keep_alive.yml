name: Keep Alive – Ping /health/db

on:
  schedule:
    # Restored 2026-08-19 to */30 min (was reduced to 1x/day on 08-18 over an
    # account-wide Actions-minutes concern that turned out not to apply to this
    # repo — public repos are unlimited/free, see project-catalog-search-latency
    # memory). Note: */30 is still longer than Railway's ~15 min sleep timeout,
    # so this does not fully guarantee anti-sleep the way the original */14 did.
    - cron: '*/30 * * * *'
  workflow_dispatch:          # manual trigger available in GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health/db (GET – wakes DB connection)
        run: |
          curl -f -X GET https://scopus-search-code.up.railway.app/health/db
          echo "DB health status: $?"

      - name: Ping /health (GET – smoke check, no DB)
        run: |
          curl -f -X GET https://scopus-search-code.up.railway.app/health
          echo "App health status: $?"
